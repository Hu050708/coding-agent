[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[project]
name = "logstats-date-boundary-demo"
version = "0.1.0"
description = "A small JSONL log statistics CLI used by the Coding Agent demo."
requires-python = ">=3.11"

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
logstats = "logstats.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
pythonpath = ["src"]
