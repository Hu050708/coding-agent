name: coding-agent

services:
  # 仅绑定本机端口，为 Web 服务提供持久化 PostgreSQL/pgvector 实例。
  postgres:
    image: pgvector/pgvector:0.8.6-pg17-bookworm
    container_name: coding-agent-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: coding_agent
      POSTGRES_USER: coding_agent
      POSTGRES_PASSWORD: ${CODING_AGENT_POSTGRES_PASSWORD:?Set CODING_AGENT_POSTGRES_PASSWORD in backend/.env}
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - coding_agent_postgres_data:/var/lib/postgresql/data
    healthcheck:
      # Compose 在接受依赖服务启动前确认目标数据库已可连接。
      test: ["CMD-SHELL", "pg_isready -U coding_agent -d coding_agent"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s

volumes:
  # 使用命名卷保留数据库状态，容器重建不会删除业务数据。
  coding_agent_postgres_data:
    name: coding_agent_postgres_data
