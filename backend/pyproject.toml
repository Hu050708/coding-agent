[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "coding-agent"
version = "0.1.0"
description = "A small, transparent coding agent built from scratch."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "openai==2.54.0",
]

[project.optional-dependencies]
web = [
    "alembic==1.19.1",
    "fastapi==0.141.1",
    "pydantic-settings==2.13.1",
    "psycopg[binary]==3.3.4",
    "sqlalchemy==2.0.52",
    "uvicorn==0.52.4",
]
dev = [
    "httpx==0.28.1",
    "httpx2==2.12.0",
    "pytest==9.1.1",
]

[project.scripts]
coding-agent = "coding_agent.cli:main"
coding-agent-web = "coding_agent.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
